<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour / Contre</title>
<meta name="theme-color" content="#f7f6f2">
<!--PWA:START-->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--PWA:END-->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="appbar">
  <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <h1 id="appTitle">Pour / Contre</h1>
  <!--PWA:START--><button id="installBtn" class="install-btn" hidden>Installer</button><!--PWA:END-->
</header>

<main class="scroller" id="scroller">
  <div class="board" id="board"></div>
</main>

<div class="overlay" id="overlay" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu du projet">
  <div class="drawer-head">
    <h2>Projet</h2>
    <button id="drawerClose" class="icon-btn" aria-label="Fermer le menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <label class="field">
    <span>Titre du projet</span>
    <input id="titleInput" type="text" maxlength="120" placeholder="Nom du projet">
  </label>

  <section>
    <h3>Fichier</h3>
    <button id="exportBtn" class="btn">Exporter en JSON</button>
    <button id="importBtn" class="btn">Importer un JSON</button>
  </section>

  <section>
    <h3>Bilan</h3>
    <div id="summary" class="summary"></div>
    <p class="hint">Nombre de points par colonne : au départ → après les réponses.</p>
  </section>

  <section>
    <h3>Données</h3>
    <button id="sampleBtn" class="btn">Charger un exemple</button>
    <button id="clearBtn" class="btn danger">Tout effacer</button>
  </section>

  <p class="hint">Sauvegarde automatique dans ce navigateur. Exporte en JSON pour conserver ou partager ton travail.</p>
</aside>

<dialog id="editor">
  <form id="editorForm" novalidate>
    <header class="ed-head">
      <h2 id="editorTitle">Point</h2>
      <button type="button" id="edClose" class="icon-btn" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <label class="field">
      <span>Point</span>
      <textarea id="edText" rows="2" placeholder="Ex. Coût de mise en œuvre élevé"></textarea>
    </label>

    <div class="field">
      <span>Colonne</span>
      <div class="seg" id="edCol" role="radiogroup" aria-label="Colonne d'origine"></div>
    </div>

    <label class="field">
      <span>Réponse <em>(optionnelle)</em></span>
      <textarea id="edReply" rows="3" placeholder="Ex. Atténué si on négocie un contrat annuel"></textarea>
    </label>

    <div class="field">
      <span>Après la réponse, le point devient…</span>
      <div class="seg" id="edTo" role="radiogroup" aria-label="Colonne de destination"></div>
    </div>

    <footer class="ed-foot">
      <button type="button" id="edDelete" class="btn danger small">Supprimer</button>
      <span class="spacer"></span>
      <div class="mover" aria-label="Position de la ligne">
        <button type="button" id="edUp" class="icon-btn" aria-label="Monter la ligne">↑</button>
        <span id="edPos">1/1</span>
        <button type="button" id="edDown" class="icon-btn" aria-label="Descendre la ligne">↓</button>
      </div>
      <button type="submit" class="btn primary small">Enregistrer</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script src="js/app.js"></script>
</body>
</html>
